[project]
name = "crm-basebot"
version = "0.1.0"
description = "Lark CRM 渠道佣金系统 - Lark Base + Bot"
requires-python = ">=3.12"
dependencies = [
    # 锁 1.x：2.0 仍在 dev，且 ws_patch.py 的 CARD 帧补丁是针对 1.x 实现写的
    "lark-oapi>=1.7.3,<2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_basebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
